<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fingerprint Access Protocol</title>
<style>
:root{
  --red:#e50914;
  --dark:#080808;
  --panel:#111;
  --line:#2a2a2a;
  --text:#f2f2f2;
  --muted:#999;
  --green:#20d47a;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:
  radial-gradient(circle at 50% 10%, #262626 0, #0b0b0b 35%, #050505 75%);
  color:var(--text); font-family:Arial,Helvetica,sans-serif;
  display:flex; justify-content:center;
}
.app{width:min(100%,520px); padding:18px 14px 28px}
.header{text-align:center;border-bottom:1px solid #333;padding-bottom:14px;margin-bottom:15px}
.kicker{font-size:11px;letter-spacing:4px;color:var(--red);font-weight:700}
h1{font-size:25px;letter-spacing:2px;margin:7px 0 3px}
.sub{font-size:12px;color:var(--muted);letter-spacing:1px}
.panel{background:rgba(17,17,17,.96);border:1px solid #303030;border-radius:14px;padding:15px;box-shadow:0 12px 35px #000}
.status{display:flex;align-items:center;gap:9px;font-size:13px;margin-bottom:12px}
.dot{width:9px;height:9px;border-radius:50%;background:#666;box-shadow:0 0 10px #666}
.dot.live{background:#ffb000;box-shadow:0 0 10px #ffb000}
.dot.ok{background:var(--green);box-shadow:0 0 12px var(--green)}
.dot.bad{background:var(--red);box-shadow:0 0 12px var(--red)}
.camera{
  position:relative; width:100%; aspect-ratio:3/4; background:#000;
  overflow:hidden;border-radius:12px;border:1px solid #3a3a3a;
}
video{width:100%;height:100%;object-fit:cover;display:block}
.overlay{position:absolute;inset:9%;border:2px solid rgba(229,9,20,.85);border-radius:50% 50% 46% 46%;pointer-events:none}
.scanline{position:absolute;left:12%;right:12%;height:2px;background:var(--red);box-shadow:0 0 12px var(--red);top:22%;opacity:0}
.scanning .scanline{opacity:1;animation:scan 1.25s linear infinite}
@keyframes scan{0%{top:20%}50%{top:78%}100%{top:20%}}
.corner{position:absolute;width:25px;height:25px;border-color:#fff;border-style:solid;opacity:.85}
.c1{top:12px;left:12px;border-width:2px 0 0 2px}.c2{top:12px;right:12px;border-width:2px 2px 0 0}
.c3{bottom:12px;left:12px;border-width:0 0 2px 2px}.c4{bottom:12px;right:12px;border-width:0 2px 2px 0}
.instructions{font-size:12px;color:#bbb;line-height:1.5;text-align:center;margin:11px 4px}
button{
  width:100%;border:0;border-radius:10px;padding:14px 12px;font-size:14px;
  font-weight:800;letter-spacing:1px;cursor:pointer;margin-top:8px;
}
.primary{background:var(--red);color:#fff}
.primary:disabled{background:#4d1114;color:#999;cursor:not-allowed}
.secondary{background:#252525;color:#fff;border:1px solid #444}
.result{
  display:none;margin-top:14px;padding:15px;border-radius:11px;text-align:center;
  border:1px solid #444;background:#0c0c0c
}
.result.show{display:block}
.result.granted{border-color:var(--green);background:rgba(32,212,122,.08)}
.result.denied{border-color:var(--red);background:rgba(229,9,20,.08)}
.resultTitle{font-size:20px;font-weight:900;letter-spacing:2px}
.resultText{font-size:12px;color:#aaa;margin-top:6px;line-height:1.5}
.attempt{font-size:10px;color:#777;text-align:center;margin-top:10px;letter-spacing:1px}
.hidden{display:none!important}
.templateNote{
  margin-top:14px;border-top:1px solid #292929;padding-top:12px;
  font-size:10px;color:#777;text-align:center;line-height:1.5
}
#template{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="kicker">INNOVERSE • SECURITY DIVISION</div>
    <h1>FINGERPRINT ACCESS</h1>
    <div class="sub">SUSPECT VERIFICATION PROTOCOL</div>
  </div>

  <div class="panel">
    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="statusText">INITIALISING CAMERA…</span>
    </div>

    <div id="cameraBox" class="camera">
      <video id="video" autoplay playsinline muted></video>
      <div class="overlay"></div>
      <div class="scanline"></div>
      <div class="corner c1"></div><div class="corner c2"></div>
      <div class="corner c3"></div><div class="corner c4"></div>
    </div>

    <div class="instructions">
      Place the suspect's fingerprint ID card inside the guide.<br>
      Keep it flat, centred and well lit. <b>Only one capture is made per attempt.</b>
    </div>

    <button id="scanBtn" class="primary" disabled>CAPTURE &amp; VERIFY</button>
    <button id="retryBtn" class="secondary hidden">TRY AGAIN</button>

    <div id="result" class="result">
      <div id="resultTitle" class="resultTitle"></div>
      <div id="resultText" class="resultText"></div>
    </div>

    <div class="attempt">ONE-SHOT VERIFICATION • LOCAL PROCESSING</div>
  </div>
</div>

<canvas id="work" class="hidden"></canvas>

let stream = null;
let templateFeatures = null;
let busy = false;

template.src = TEMPLATE_SRC;

function setStatus(text, kind="") {
  statusText.textContent = text;
  dot.className = "dot" + (kind ? " " + kind : "");
}

async function startCamera() {
  stopCamera();

  result.className = "result";
  retryBtn.classList.add("hidden");
  scanBtn.disabled = true;
  cameraBox.classList.remove("scanning");
  setStatus("REQUESTING CAMERA PERMISSION…");

  // Camera access works only in a secure context (HTTPS/localhost).
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus("CAMERA NEEDS HTTPS");
    result.className = "result show denied";
    resultTitle.textContent = "CAMERA UNAVAILABLE";
    resultText.textContent =
      "This page is opened from Chrome Downloads (content://), so Chrome will not allow camera access here. Open the same HTML from an HTTPS website, then tap Allow when Chrome asks for camera permission.";
    return;
  }

  try {
    // Ask Chrome for permission immediately when the page loads.
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    scanBtn.disabled = false;
    setStatus("CAMERA READY • PLACE ID CARD IN GUIDE", "live");
  } catch (err) {
    console.error("Camera error:", err);

    setStatus("CAMERA PERMISSION REQUIRED");
    result.className = "result show denied";
    resultTitle.textContent = "ALLOW CAMERA ACCESS";
    resultText.textContent =
      "Chrome blocked camera access. Tap the camera/lock icon beside the address bar, set Camera to Allow, then reload this page.";
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
}

function grayResize(source, size=96) {
  const c = document.createElement("canvas");
  c.width = size; c.height = size;
  const ctx = c.getContext("2d", {willReadFrequently:true});
  ctx.drawImage(source, 0, 0, size, size);
  const d = ctx.getImageData(0,0,size,size).data;
  const out = new Float32Array(size*size);
  for(let i=0,j=0;i<d.length;i+=4,j++){
    out[j] = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
  }
  return out;
}

// Find the ink/fingerprint bounding area and normalise it.
// This makes the comparison tolerant of different card framing.
function normalise(source, size=96) {
  const rawSize = 160;
  const raw = grayResize(source, rawSize);

  let minX=rawSize, minY=rawSize, maxX=-1, maxY=-1;
  for(let y=0;y<rawSize;y++){
    for(let x=0;x<rawSize;x++){
      if(raw[y*rawSize+x] < 205){
        if(x<minX)minX=x; if(x>maxX)maxX=x;
        if(y<minY)minY=y; if(y>maxY)maxY=y;
      }
    }
  }
  if(maxX<0) return grayResize(source,size);

  const pad=8;
  minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
  maxX=Math.min(rawSize-1,maxX+pad); maxY=Math.min(rawSize-1,maxY+pad);

  const c=document.createElement("canvas");
  c.width=size;c.height=size;
  const ctx=c.getContext("2d",{willReadFrequently:true});

  // Reconstruct a small grayscale image from the normalised crop.
  const tmp=document.createElement("canvas");
  tmp.width=rawSize;tmp.height=rawSize;
  const td=tmp.getContext("2d").createImageData(rawSize,rawSize);
  for(let i=0,j=0;i<td.data.length;i+=4,j++){
    const v=raw[j];
    td.data[i]=td.data[i+1]=td.data[i+2]=v;td.data[i+3]=255;
  }
  tmp.getContext("2d").putImageData(td,0,0);
  ctx.drawImage(tmp,minX,minY,maxX-minX+1,maxY-minY+1,0,0,size,size);
  return ctx.getImageData(0,0,size,size).data;
}

function featureVector(source) {
  const data = normalise(source, 96);
  const gray = new Float32Array(96*96);
  for(let i=0,j=0;i<data.length;i+=4,j++) gray[j]=data[i];

  // Threshold + light blur-like neighbourhood average.
  const feat = new Float32Array(48*48);
  for(let y=0;y<48;y++){
    for(let x=0;x<48;x++){
      let sum=0;
      for(let yy=0;yy<2;yy++) for(let xx=0;xx<2;xx++){
        sum += gray[(y*2+yy)*96+(x*2+xx)];
      }
      const v=sum/4;
      feat[y*48+x] = v < 185 ? 1 : 0;
    }
  }
  return feat;
}

function similarity(a,b){
  let same=0, total=a.length;
  for(let i=0;i<total;i++) if(a[i]===b[i]) same++;
  return same/total;
}

function edgeSimilarity(a,b){
  // Compare coarse local transitions; useful when lighting changes.
  let same=0,total=0;
  const w=48;
  for(let y=0;y<w-1;y++){
    for(let x=0;x<w-1;x++){
      const ax=a[y*w+x]!==a[y*w+x+1];
      const ay=a[y*w+x]!==a[(y+1)*w+x];
      const bx=b[y*w+x]!==b[y*w+x+1];
      const by=b[y*w+x]!==b[(y+1)*w+x];
      if(ax===bx) same++;
      if(ay===by) same++;
      total+=2;
    }
  }
  return same/total;
}

function verify(frameSource){
  const f=featureVector(frameSource);
  const direct=similarity(f,templateFeatures);
  const edge=edgeSimilarity(f,templateFeatures);
  const score = direct*0.60 + edge*0.40;
  return {
    score,
    direct,
    edge,
    accepted: score >= 0.62 && direct >= 0.52
  };
}

function showResult(ok, score){
  result.className = "result show " + (ok ? "granted" : "denied");
  if(ok){
    resultTitle.textContent = "ACCESS GRANTED";
    resultText.textContent = "FINGERPRINT VERIFIED • SUSPECT MATCH CONFIRMED • ENTRY AUTHORISED";
    playGrantedSound();
    setStatus("VERIFICATION SUCCESSFUL","ok");
  }else{
    resultTitle.textContent = "NO ENTRY";
    resultText.textContent = "FINGERPRINT DOES NOT MATCH THE AUTHORISED SUSPECT • TRY AGAIN";
    playDeniedSound();
    setStatus("VERIFICATION FAILED","bad");
  }
}


// ---------------- SOUND EFFECTS ----------------
let audioCtx = null;

function initAudio(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audioCtx = new AC();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
}

function tone(freq, duration, type="sine", volume=0.045, delay=0){
  if(!audioCtx) return;
  const t = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(volume, t + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration + 0.03);
}

function playCaptureSound(){
  initAudio();
  tone(1050, 0.07, "square", 0.035);
  tone(720, 0.10, "square", 0.025, 0.08);
}

function playProcessingSound(){
  initAudio();
  tone(520, 0.08, "sine", 0.025);
  tone(620, 0.08, "sine", 0.025, 0.10);
  tone(720, 0.08, "sine", 0.025, 0.20);
}

function playGrantedSound(){
  initAudio();
  tone(523, 0.12, "sine", 0.045);
  tone(659, 0.12, "sine", 0.045, 0.13);
  tone(784, 0.20, "sine", 0.055, 0.26);
}

function playDeniedSound(){
  initAudio();
  tone(180, 0.16, "sawtooth", 0.035);
  tone(125, 0.22, "sawtooth", 0.035, 0.17);
}

async function captureOnce(){
  if(busy || !stream) return;
  initAudio();
  playCaptureSound();
  busy=true;
  scanBtn.disabled=true;
  retryBtn.classList.add("hidden");
  cameraBox.classList.add("scanning");
  setStatus("SCANNING • ONE CAPTURE ONLY","live");
  playProcessingSound();

  // Give the autofocus a moment, but never capture twice.
  await new Promise(r=>setTimeout(r,1100));

  const c=document.createElement("canvas");
  c.width=video.videoWidth || 640;
  c.height=video.videoHeight || 480;
  const ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(video,0,0,c.width,c.height);

  cameraBox.classList.remove("scanning");
  const verdict=verify(c);

  stopCamera();
  showResult(verdict.accepted, verdict.score);
  retryBtn.classList.remove("hidden");
  busy=false;
}

scanBtn.addEventListener("click", captureOnce);
retryBtn.addEventListener("click", startCamera);

template.onload = async () => {
  templateFeatures = featureVector(template);
  await startCamera();
};

window.addEventListener("pagehide", stopCamera);

document.addEventListener("DOMContentLoaded", () => {
  // Automatically request camera permission when the page loads.
  startCamera();
});
</script>
